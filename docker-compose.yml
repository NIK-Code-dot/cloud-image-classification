services:
  postgres:
    image: postgres:16
    container_name: image_classification_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: mluser
      POSTGRES_PASSWORD: mlpassword
      POSTGRES_DB: image_classification

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
